name: Continuous Deployment

on:
  push:
    branches: [ main ]
  release:
    types: [ published ]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        type: choice
        options:
          - staging
          - production
        default: staging

env:
  UV_VERSION: "0.8.17"  # Latest stable version
  PYTHON_VERSION: "3.12"

jobs:
  deploy:
    name: Deploy to ${{ inputs.environment || 'staging' }}
    runs-on: windows-latest
    timeout-minutes: 20
    
    environment:
      name: ${{ inputs.environment || 'staging' }}
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v5
      with:
        fetch-depth: 0  # Required for version detection
    
    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        version: ${{ env.UV_VERSION }}
        enable-cache: true
        cache-dependency-glob: "uv.lock"

    - name: Set up Python
      run: uv python install ${{ env.PYTHON_VERSION }}
    
    - name: Install dependencies
      run: |
        uv sync --locked --all-extras
        uv add --dev pyinstaller
    
    - name: Run pre-deployment tests
      run: |
        Write-Host "Running pre-deployment tests..." -ForegroundColor Cyan
        uv run --frozen pytest test_transform.py -v --tb=short -x
        
        # Test basic functionality
        echo "Hello World" | uv run --frozen python String_Multitool.py /u
        
        Write-Host "Pre-deployment tests passed" -ForegroundColor Green
    
    - name: Build deployment package
      run: |
        Write-Host "Building deployment package..." -ForegroundColor Cyan
        
        # Build executable
        .\build.ps1 -SkipTests -Clean
        
        # Add deployment metadata
        $deploymentInfo = @{
            environment = '${{ inputs.environment || 'staging' }}'
            version = "$(git describe --tags --abbrev=0 2>$null || git rev-parse --short HEAD)"
            build_date = "$(Get-Date -Format 'yyyy-MM-dd HH:mm:ss UTC')"
            commit_sha = '${{ github.sha }}'
            deployment_id = '${{ github.run_id }}'
        }
        
        $deploymentInfo | ConvertTo-Json -Depth 2 | Out-File -FilePath "dist/string-multitool-portable/deployment-info.json" -Encoding UTF8
        
        # Update ZIP with deployment info
        if (Test-Path "dist/string-multitool-portable.zip") {
            Compress-Archive -Path "dist/string-multitool-portable/deployment-info.json" -DestinationPath "dist/string-multitool-portable.zip" -Update
        }
        
        Write-Host "Deployment package built successfully" -ForegroundColor Green
    
    - name: Upload deployment artifacts
      uses: actions/upload-artifact@v4
      with:
        name: deployment-${{ inputs.environment || 'staging' }}-${{ github.run_id }}
        path: |
          dist/string-multitool-portable.zip
          dist/string-multitool-portable/
        retention-days: ${{ inputs.environment == 'production' && 365 || 30 }}
    
    - name: Verify deployment package
      run: |
        Write-Host "Verifying deployment package..." -ForegroundColor Cyan
        
        $zipPath = "dist/string-multitool-portable.zip"
        
        if (Test-Path $zipPath) {
            $zipInfo = Get-Item $zipPath
            Write-Host "ZIP package verified: $($zipInfo.Name) ($([math]::Round($zipInfo.Length / 1MB, 2)) MB)" -ForegroundColor Green
        } else {
            Write-Error "ZIP package not found"
            exit 1
        }
        
        # Test extracted executable
        if (Test-Path "dist/string-multitool-portable/String_Multitool.exe") {
            & "dist/string-multitool-portable/String_Multitool.exe" help | Out-Null
            if ($LASTEXITCODE -eq 0) {
                Write-Host "Executable functionality verified" -ForegroundColor Green
            } else {
                Write-Error "Executable test failed"
                exit 1
            }
        }
    
    - name: Create release (if production)
      if: inputs.environment == 'production' && github.event_name == 'release'
      uses: softprops/action-gh-release@v2
      with:
        files: dist/string-multitool-portable.zip
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deployment-summary:
    name: Deployment Summary
    needs: [deploy]
    runs-on: windows-latest
    if: always()
    
    steps:
    - name: Generate deployment summary
      run: |
        Write-Host "Deployment Summary" -ForegroundColor Cyan
        Write-Host "==================" -ForegroundColor Cyan
        
        $environment = '${{ inputs.environment || 'staging' }}'
        $deploymentResult = '${{ needs.deploy.result }}'
        
        Write-Host "Environment: $environment" -ForegroundColor Yellow
        Write-Host "Result: $deploymentResult" -ForegroundColor Yellow
        Write-Host "Timestamp: $(Get-Date -Format 'yyyy-MM-dd HH:mm:ss UTC')" -ForegroundColor Yellow
        
        if ($deploymentResult -eq 'success') {
            Write-Host "Deployment completed successfully!" -ForegroundColor Green
        } else {
            Write-Host "Deployment encountered issues. Please review the logs." -ForegroundColor Red
            exit 1
        }